[project]
name = "crypto-info-mcp"
version = "0.2.2"
description = "FastMCP service for crypto market summaries, CoinGecko coin details, and recent Telegram news."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13.3",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "telethon>=1.42.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff==0.15.21",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".repometa"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C90", "N", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "example", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
